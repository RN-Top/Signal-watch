name: Check

on:
  pull_request:
  push:
    branches: [main]

jobs:
  run-model:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python model.py
      - run: python -c "import json; d = json.load(open('docs/forecast.json')); assert d['indicator_count'] > 0"
