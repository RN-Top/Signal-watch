name: Weekly forecast

on:
  schedule:
    - cron: "0 6 * * 1" # every Monday 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  forecast:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Refresh real-world data
        run: python data.py
      - name: Run the model
        run: python model.py
      - name: Commit data and forecast
        run: |
          git config user.name "signal-watch-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data reports docs/forecast.json
          git diff --cached --quiet || git commit -m "Data refresh and forecast $(date -u +%F)"
          git pull --rebase origin main
          git push
